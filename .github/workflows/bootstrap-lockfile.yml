name: Bootstrap lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - build/bootstrap-verify

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
