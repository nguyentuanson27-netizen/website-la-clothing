name: Refresh auth lock

on:
  push:
    branches:
      - build/auth-server-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/la_clothing
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out branch with main for schema diff
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5
        with:
          ref: build/auth-server-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Refresh lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Install from refreshed lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate and generate Prisma
        run: |
          pnpm prisma:validate
          pnpm prisma:generate

      - name: Generate auth migration from main schema
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/schema-before-auth.prisma
          mkdir -p prisma/migrations/20260809084500_add_auth_models
          pnpm exec prisma migrate diff \
            --from-schema /tmp/schema-before-auth.prisma \
            --to-schema prisma/schema.prisma \
            --script \
            > prisma/migrations/20260809084500_add_auth_models/migration.sql

      - name: Commit generated lockfile and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml prisma/migrations/20260809084500_add_auth_models/migration.sql
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: generate Better Auth lockfile and migration"
          git push origin HEAD:build/auth-server-foundation
