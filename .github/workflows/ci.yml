name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: la_clothing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d la_clothing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/la_clothing
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install from lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Deploy database migrations
        run: pnpm prisma:migrate:deploy

      - name: Database smoke tests
        run: pnpm test:db

      - name: Next HTTP security smoke
        run: node --experimental-strip-types scripts/cart-server-action-http-smoke.ts

      - name: Guest checkout Server Action HTTP smoke
        env:
          PANCAKE_API_KEY: ci-only-pancake-placeholder
          PANCAKE_SHOP_ID: "920007"
        run: node --experimental-strip-types scripts/guest-checkout-server-action-http-smoke.ts

      - name: Authenticated admin HTTP authorization smoke
        run: node --experimental-strip-types scripts/admin-authz-http-smoke.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Build
        env:
          LA_SHIPPING_FEE_VND: "17000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "650000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "5"
        run: pnpm build

      - name: Shipping promotion runtime policy smoke
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3218
          LA_SHIPPING_FEE_VND: "25000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "750000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "4"
        shell: bash
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 --port 3218 > "$RUNNER_TEMP/shipping-runtime.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/shipping-runtime.log"
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3218/lookbook > "$RUNNER_TEMP/lookbook.html"; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/shipping-runtime.log"
            exit 1
          fi

          if grep -Fq "750.000" "$RUNNER_TEMP/lookbook.html" && grep -Fq "4 sản phẩm" "$RUNNER_TEMP/lookbook.html"; then
            if grep -Fq "650.000" "$RUNNER_TEMP/lookbook.html" || grep -Fq "5 sản phẩm" "$RUNNER_TEMP/lookbook.html"; then
              echo "Shipping promotion mixes runtime and build-time policy"
              exit 1
            fi
            echo "Shipping promotion resolved the runtime policy"
            exit 0
          fi

          if grep -Fq "650.000" "$RUNNER_TEMP/lookbook.html" && grep -Fq "5 sản phẩm" "$RUNNER_TEMP/lookbook.html"; then
            echo "Shipping promotion rendered the build-time policy instead of the runtime policy"
            exit 1
          fi

          echo "Shipping promotion rendered an unexpected policy state"
          exit 1

  admin-a11y-runtime:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3212
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Prepare PostgreSQL 16
        shell: bash
        run: |
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/pgdata"
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/postgres.log" -o "-p 5432" start
          "$PG_BIN/createdb" -p 5432 la_clothing
          echo "DATABASE_URL=postgresql://$(whoami)@127.0.0.1:5432/la_clothing" >> "$GITHUB_ENV"

      - name: Install application from lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Deploy database migrations
        run: pnpm prisma:migrate:deploy

      - name: Install pinned accessibility runtime tooling
        working-directory: tests/a11y-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: tests/a11y-runtime
        run: npx playwright install chromium

      - name: Configure macOS for VoiceOver automation
        working-directory: tests/a11y-runtime
        run: ./node_modules/.bin/guidepup setup

      - name: Install Guidepup project assets
        working-directory: tests/a11y-runtime
        run: ./node_modules/.bin/guidepup install

      - name: Run admin browser accessibility and VoiceOver runtime
        working-directory: tests/a11y-runtime
        run: npx playwright test --config playwright.config.ts
